<!-- challenge/templates/result.html -->
{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ category }} - 第 {{ level }} 关 - 结果</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        /* 确保导航栏和页尾充满页面 */
        .header,
        .footer {
            width: 100%;
        }

        /* 确保 main 部分和搜索框区域整体居中 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <a href="#">Community Forums</a>
            </div>
            <ul class="nav-links">
                <li><a href="#">首页</a></li>
                <li><a href="#">关于</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1 class="title">{{ category }} - 第 {{ level }} 关 - 结果</h1>
        <p class="message">{{ message }}</p>
        <a href="{% url 'category_select' %}" class="start-btn">返回选择分类</a>
    </div>
</body>
</html>
